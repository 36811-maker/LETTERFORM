<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F8F5F0">
  <title>LETTERFORM — Palavras que permanecem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-view="home"><span class="brand-mark">L</span><span>LETTERFORM<small>DIGITAL LETTER STUDIO</small></span></a>
      <div class="side-label">ESPAÇO PESSOAL</div>
      <nav class="navigation">
        <button class="nav-link active" data-view="home"><span>⌂</span> Início</button>
        <button class="nav-link" data-view="editor"><span>＋</span> Nova carta</button>
        <button class="nav-link" data-view="letters"><span>▤</span> Minhas cartas</button>
        <button class="nav-link" data-view="received"><span>↙</span> Recebidas</button>
        <button class="nav-link" data-view="envelopes"><span>✉</span> Envelopes</button>
        <button class="nav-link" data-view="calendar"><span>▦</span> Calendário</button>
        <button class="nav-link" data-view="favorites"><span>♡</span> Favoritas</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="side-note"><span class="note-dot"></span><div>Um lugar para guardar<br>o que merece permanecer.</div></div>
        <button class="nav-link" data-view="settings"><span>⚙</span> Configurações</button>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Abrir menu">☰</button>
        <div class="breadcrumb">LETTERFORM <span>/</span> <strong id="currentSection">Início</strong></div>
        <div class="topbar-right"><span class="today" id="todayLabel"></span><span class="avatar" id="avatar">L</span></div>
      </header>
      <div class="content" id="app"></div>
      <footer class="footer">LETTERFORM <span>·</span> Palavras que permanecem.</footer>
    </main>
  </div>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <div class="toast" id="toast" role="status"></div>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
